    description: Netflix Eureka REST API — Instances business capability. Self-contained, no shared references.
    resources:
    - name: apps-appId
      path: /apps/{appId}
      operations:
      - name: registerinstance
        method: POST
        description: Register a new application instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: appId
          in: path
          type: string
          description: Application name
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: apps-appId-instanceId
      path: /apps/{appId}/{instanceId}
      operations:
      - name: getinstance
        method: GET
        description: Get a specific instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          description: Instance ID (typically hostname)
          required: true
      - name: deregisterinstance
        method: DELETE
        description: Deregister an instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
      - name: sendheartbeat
        method: PUT
        description: Send heartbeat
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
        - name: status
          in: query
          type: string
          description: Overridden status value
        - name: lastDirtyTimestamp
          in: query
          type: string
          description: Last dirty timestamp for conflict resolution
        - name: overriddenstatus
          in: query
          type: string
          description: Overridden status
    - name: apps-appId-instanceId-metadata
      path: /apps/{appId}/{instanceId}/metadata
      operations:
      - name: updateinstancemetadata
        method: PUT
        description: Update instance metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.

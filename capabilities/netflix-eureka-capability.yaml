        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appId}/{instanceId}
      name: sendheartbeat
      operations:
      - method: PUT
        name: sendheartbeat
        description: Send heartbeat
        call: netflix-eureka.sendheartbeat
        with:
          appId: rest.appId
          instanceId: rest.instanceId
        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appId}/{instanceId}/status
      name: updateinstancestatus
      operations:

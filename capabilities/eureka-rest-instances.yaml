          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
        - name: value
          in: query
          type: string
          description: New status value
          required: true
        - name: lastDirtyTimestamp
          in: query
          type: string
      - name: removeinstancestatusoverride
        method: DELETE
        description: Remove status override
        outputRawFormat: json
        outputParameters:
        - name: result

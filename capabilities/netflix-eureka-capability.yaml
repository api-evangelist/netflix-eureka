    - path: /svips/{svipAddress}
      name: getbysecurevipaddress
      operations:
      - method: GET
        name: getbysecurevipaddress
        description: Query by secure VIP address
        call: netflix-eureka.getbysecurevipaddress
        with:
          svipAddress: rest.svipAddress
        outputParameters:
        - type: object

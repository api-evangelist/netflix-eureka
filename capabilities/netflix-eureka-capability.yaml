naftiko: 1.0.0-alpha2
info:
  label: Netflix Eureka REST API
  description: Eureka REST operations for service registration, discovery, and instance management. Eureka is a REST-based
    service for locating services for the purpose of load balancing and failover of middle-tier servers.
  tags:
  - Netflix
  - Eureka
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: netflix-eureka
    baseUri: http://localhost:8761/eureka
    description: Netflix Eureka REST API HTTP API.
    resources:
    - name: apps
      path: /apps
      operations:
      - name: getallapplications
        method: GET
        description: Get all registered applications
        inputParameters:
        - name: regions
          in: query
          type: string
          description: Comma-separated list of remote regions to include
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appid
      path: /apps/{appId}
      operations:
      - name: getapplication
        method: GET
        description: Get application by name
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
          description: Application name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: registerinstance
        method: POST
        description: Register a new application instance
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
          description: Application name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appid-instanceid
      path: /apps/{appId}/{instanceId}
      operations:
      - name: getinstance
        method: GET
        description: Get a specific instance
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
          description: Instance ID (typically hostname)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deregisterinstance
        method: DELETE
        description: Deregister an instance
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: sendheartbeat
        method: PUT
        description: Send heartbeat
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
        - name: status
          in: query
          type: string
          description: Overridden status value
        - name: lastDirtyTimestamp
          in: query
          type: string
          description: Last dirty timestamp for conflict resolution
        - name: overriddenstatus
          in: query
          type: string
          description: Overridden status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appid-instanceid-status
      path: /apps/{appId}/{instanceId}/status
      operations:
      - name: updateinstancestatus
        method: PUT
        description: Update instance status override
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
        - name: value
          in: query
          type: string
          required: true
          description: New status value
        - name: lastDirtyTimestamp
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: removeinstancestatusoverride
        method: DELETE
        description: Remove status override
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
        - name: lastDirtyTimestamp
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appid-instanceid-metadata
      path: /apps/{appId}/{instanceId}/metadata
      operations:
      - name: updateinstancemetadata
        method: PUT
        description: Update instance metadata
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
        - name: instanceId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instances-instanceid
      path: /instances/{instanceId}
      operations:
      - name: getinstancebyid
        method: GET
        description: Get instance by ID
        inputParameters:
        - name: instanceId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-delta
      path: /apps/delta
      operations:
      - name: getdelta
        method: GET
        description: Get recent changes (delta)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: vips-vipaddress
      path: /vips/{vipAddress}
      operations:
      - name: getbyvipaddress
        method: GET
        description: Query by VIP address
        inputParameters:
        - name: vipAddress
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: svips-svipaddress
      path: /svips/{svipAddress}
      operations:
      - name: getbysecurevipaddress
        method: GET
        description: Query by secure VIP address
        inputParameters:
        - name: svipAddress
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
